name: Qualify source-controller

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full commit SHA of the selected source-controller ref
        required: true
        type: string
      task_manager_sha:
        description: Full commit SHA of the task-manager publisher
        required: true
        type: string
      team_registry_sha:
        description: Full commit SHA of the team-registry publisher
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      TASK_MANAGER_SHA: ${{ inputs.task_manager_sha }}
      TEAM_REGISTRY_SHA: ${{ inputs.team_registry_sha }}
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - name: Verify dispatch SHAs
        shell: bash
        run: |
          for input in EXPECTED_SOURCE_SHA TASK_MANAGER_SHA TEAM_REGISTRY_SHA; do
            if [[ ! "${!input}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "$input must be a 40-digit hexadecimal commit SHA." >&2
              exit 1
            fi
          done
          if [[ "$GITHUB_SHA" != "${EXPECTED_SOURCE_SHA,,}" ]]; then
            echo 'The dispatch ref does not resolve to expected_source_sha.' >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Stage declarations and pinned publisher schemas
        shell: bash
        run: |
          source_sha="${EXPECTED_SOURCE_SHA,,}"
          if [[ "$(git rev-parse HEAD)" != "$source_sha" ]]; then
            echo 'The checkout does not match expected_source_sha.' >&2
            exit 1
          fi
          if [[ ! -f go.mod ]]; then
            echo 'Dispatch on the reviewed standalone candidate branch.' >&2
            exit 1
          fi

          contracts="$RUNNER_TEMP/source-controller-contracts"
          mkdir -p "$contracts/task-manager" "$contracts/team-registry"

          # The candidate carries the Gitea declaration projection as a tracked file.
          # The contract test reads its schemas map under the existing fixture name.
          git show "$source_sha:qualification/source-controller-declarations.json" > "$contracts/shared-test-inputs.json"

          fetch_schema() {
            local url="$1" output="$2" status
            status="$(curl -q --silent --show-error --fail --proto '=https' --max-time 30 \
              --output "$contracts/$output" --write-out '%{http_code}' "$url")"
            if [[ "$status" != 200 ]]; then
              echo "Unexpected HTTP status $status for $url." >&2
              exit 1
            fi
          }

          task_url="https://raw.githubusercontent.com/pandops/flowai-task-manager/${TASK_MANAGER_SHA,,}/schemas"
          team_url="https://raw.githubusercontent.com/pandops/flowai-team-registry/${TEAM_REGISTRY_SHA,,}/schemas"
          fetch_schema "$task_url/defs.schema.json" task-manager/defs.schema.json
          fetch_schema "$task_url/event.intake_processed.schema.json" task-manager/event.intake_processed.schema.json
          fetch_schema "$team_url/event.team_updated.schema.json" team-registry/event.team_updated.schema.json

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.2'
          cache: false

      - name: Unit tests
        shell: bash
        run: |
          export FLOWAI_CONTRACT_FIXTURE_DIR="$RUNNER_TEMP/source-controller-contracts"
          go test -mod=readonly -count=1 -coverpkg=./... -v ./...

      - name: PostgreSQL integration tests
        shell: bash
        run: |
          postgres='docker.io/library/postgres@sha256:a85daf0dbd5e79586e850e3fe4b21b796799828ad015ce2166aeb98cc24da61c'
          docker pull --platform linux/amd64 "$postgres"
          # The existing test fixture uses this tag in the job's local Docker store.
          docker tag "$postgres" docker.io/library/postgres:16
          go test -mod=readonly -count=1 -coverpkg=./... -tags=integration -v ./test

      - name: Build local Linux image
        shell: bash
        run: |
          docker build --platform linux/amd64 -f Containerfile --iidfile "$RUNNER_TEMP/source-controller.iid" .
          cat "$RUNNER_TEMP/source-controller.iid"
